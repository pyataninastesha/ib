{% extends "base.html" %}
{% block title %}В заявку — {{ product.name }}{% endblock %}

{% block content %}
<h2 class="mb-3">🛒 В заявку — {{ product.name }}</h2>

<p class="text-muted">Единица: <b>{{ product.unit }}</b></p>

<form method="post" class="card p-3" style="max-width: 520px;">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Количество</label>
    <input type="number" name="quantity" step="0.01" min="0" class="form-control" required>
  </div>

  <button class="btn btn-primary">Добавить в заявку</button>
  <a class="btn btn-link" href="{% url 'stock_list' %}">Назад</a>
</form>
{% endblock %}
