{% extends 'base.html' %}
{% block title %}Организация{% endblock %}
{% block content %}
<h2 class="mb-3">Организация</h2>

<div class="alert alert-info">
  <div><strong>Код подключения:</strong> <span style="font-size: 1.2em">{{ org.join_code }}</span></div>
  <div class="small">Передай этот код участникам/сотрудникам — они введут его при регистрации.</div>
</div>

<form method="post" class="card p-3 shadow-sm">
  {% csrf_token %}
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Название</label>
      <input class="form-control" name="name" value="{{ org.name }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Тип заведения</label>
      <select class="form-select" name="org_type">
        {% for k,v in org.ORG_TYPES %}
          <option value="{{ k }}" {% if org.org_type == k %}selected{% endif %}>{{ v }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-12">
      <label class="form-label">Цели (через запятую)</label>
      <input class="form-control" name="goals" value="{{ org.goals }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Среднее порций в день</label>
      <input type="number" min="0" class="form-control" name="avg_portions_per_day" value="{{ org.avg_portions_per_day }}">
    </div>
    <div class="col-md-6 d-flex align-items-end">
      <button class="btn btn-primary w-100" type="submit">Сохранить</button>
    </div>
  </div>

  <hr>
  <button class="btn btn-outline-danger" name="regen_code" value="1" type="submit" onclick="return confirm('Сгенерировать новый код? Старый перестанет работать.')">
    Сгенерировать новый код подключения
  </button>
</form>
{% endblock %}
